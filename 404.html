<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>404 – Seite nicht gefunden | copilot.ovh</title>
		<script src="init.js"></script>
		<link rel="stylesheet" href="styles.css" />
		<style>
			.error-page {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 80vh;
				text-align: center;
				padding: 40px 24px;
			}
			.error-code {
				font-size: clamp(5rem, 15vw, 10rem);
				font-weight: 900;
				line-height: 1;
				letter-spacing: -0.04em;
				background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet) 60%, var(--accent-magenta));
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				margin: 0 0 16px;
			}
			.error-page h1 {
				margin: 0 0 12px;
				font-size: clamp(1.4rem, 3vw, 2rem);
				color: var(--text-bright);
			}
			.error-page p {
				color: var(--muted-strong);
				max-width: 440px;
				margin: 0 0 32px;
				font-size: 1.05rem;
			}
		</style>
	</head>
	<body>
		<main class="error-page">
			<div class="error-code" aria-hidden="true">404</div>
			<h1>Seite nicht gefunden</h1>
			<p>Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
			<a href="/" class="btn btn-primary btn-lg">
				Zur Startseite
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<line x1="5" y1="12" x2="19" y2="12"/>
					<polyline points="12 5 19 12 12 19"/>
				</svg>
			</a>
		</main>
	</body>
</html>
